<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.4.0/fonts/remixicon.css" rel="stylesheet" />
     <link rel="stylesheet" href="./sidebar.css"> 
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Gestion Boutique</title>

</head>



<body class="overflow-x-hidden ">

    <div class="w-full  flex  ">
        <!-- Barre latérale -->
        <div id="sidebar" class=" bg-white p-4 grid grid-cols-1 gap-2 ">
            <div class="flex justify-center items-center gap-2">
                <img src="../../HTML/composant/image/logo (2).png" class="w-[20%] h-[6vh] img1" alt="">
                <div class="text-2xl sidebar-text">Clinico</div>
            </div>
            <!-- Section des éléments de la barre latérale -->
            <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-home-4-line text-black text-sm"></i>
                <div class=" text-black sidebar-text text-sm ">Home</div>
            </ul>

            <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-function-add-line text-black text-sm"></i>
                <div class=" text-black sidebar-text text-sm">RV</div>
            </ul>

            <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-hospital-line text-black text-sm"></i>
                <div class=" text-black sidebar-text text-sm">Medecin</div>
            </ul>

            <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-line-chart-line  text-black text-sm"></i>
                <div class=" text-black sidebar-text text-sm">Patient</div>
            </ul>

            <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-calendar-line text-black text-sm"></i>
                <div class=" text-black sidebar-text text-sm">Secretaire</div>
            </ul>





            <div class="grid grid-cols-1 gap-3 mt-14">
                <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <i class="ri-line-chart-line  text-black text-sm"></i>
                    <div class=" text-black sidebar-text text-sm">Messages</div>
                </ul>
    
                <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <i class="ri-calendar-line text-black text-sm"></i>
                    <div class="flex justify-between w-full ">
                        <div class=" text-black sidebar-text text-sm">Notifications</div>
                        <i class="ri-add-circle-line ms text-sm"></i>
                    </li>
                </ul>
    
                <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <i class="ri-time-line text-black text-sm"></i>
                    <div class=" text-black sidebar-text text-sm">Settings</div>
                </ul>
    
                <ul class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <div><i class="ri-money-dollar-box-fill text-black text-sm "></i></div>
                    <div class="flex justify-between w-full ">
                        <div class=" text-black sidebar-text text-sm">Logout</div>
                        <i class="ri-arrow-drop-down-line text-sm ms"></i>
                    </li>
                </ul>

                <div class="flex gap-3 mt-5 sidebar-item">
                    <img src="../../HTML/composant/image/profil.png" class=" rounded-full profil"
                        alt="">
                    <div class="sidebar-text">
                        <span class="text-md">Michael Smith</span>
                        <span class="text-sm">michel12@gmail.com</span>
                    </div>
                </div>
    
            </div>
        </div>

        
    </div>

    <!-- JavaScript -->
    <script src="./sidebar.js"></script> 

</body>

</html>
