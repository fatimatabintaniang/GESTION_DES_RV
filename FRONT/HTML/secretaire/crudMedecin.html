<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD-MEDECIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../composant/sidebar/sidebar.css">
</head>

<body class="w-full overflow-x-auto bg-white">
    <div class="bg-[#262424] opacity-75 w-full h-[100vh] absolute hidden" id="contenu"></div>
    <div class="grid grid-cols-[18%_auto] flex items-start w-full" id="cont" >
        <!-- Barre latérale -->
        <div id="sidebar" class=" bg-white p-4 grid grid-cols-1 gap-2 ">
            <div class="flex  items-center gap-2">
                <img src="../composant/image/Logo (3).png" class="w-[20%] h-[6vh] img1" alt="">
                <span class="sidebar-text">Clinico</span>
            </div>

            <!-- Section des éléments de la barre latérale -->
            <ul
                class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-home-4-line text-black text-sm "></i>
                <li class=" text-black sidebar-text text-sm "><a href="#">Home</a></li>
            </ul>

            <ul
                class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-function-add-line text-black text-sm"></i>
                <li class=" text-black sidebar-text text-sm "><a href="">RV</a></li>
            </ul>

            <ul
                class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-hospital-line text-black text-sm"></i>
                <li class=" text-black sidebar-text text-sm "><a href="#">Medecin</a></li>
            </ul>

            <ul
                class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-line-chart-line  text-black text-sm"></i>
                <li class=" text-black sidebar-text text-sm "><a href="#">Analytics</a></li>
            </ul>

            <ul
                class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                <i class="ri-calendar-line text-black text-sm"></i>
                <li class=" text-black sidebar-text text-sm"><a href="#">Schedules</a></li>
            </ul>





            <div class="grid grid-cols-1 gap-3 mt-14">
                <ul
                    class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <i class="ri-line-chart-line  text-black text-sm"></i>
                    <li class=" text-black sidebar-text text-sm"><a href="#">Messages</a></li>
                </ul>

                <ul
                    class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <i class="ri-calendar-line text-black text-sm"></i>
                    <div class="flex justify-between w-full ">
                        <li class=" text-black sidebar-text text-sm"><a href="#">Notifications</a></li>
                        <i class="ri-add-circle-line ms text-sm i1"></i>
                    </div>
                </ul>

                <ul
                    class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <i class="ri-time-line text-black text-sm"></i>
                    <li class=" text-black sidebar-text text-sm"><a href="#">Settings</a></li>
                </ul>

                <ul
                    class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100  hover:text-white rounded">
                    <div><i class="ri-money-dollar-box-fill text-black text-sm "></i></div>
                    <div class="flex justify-between w-full ">
                        <li class=" text-black sidebar-text text-sm"><a href="#">Logout</a></li>
                        <i class="ri-arrow-drop-down-line text-sm ms i1"></i>
                    </div>
                </ul>

                <div class="flex gap-3 mt-5 sidebar-item">
                    <img src="../../HTML/composant/image/profil.png" class="w-[40px] h-[40px] img2 rounded-full profil"
                        alt="">
                    <div class="sidebar-text">
                        <span class="text-md">Michael Smith</span>
                        <span class="text-sm">michel12@gmail.com</span>
                    </div>
                </div>

            </div>
        </div>
        <!-- contenu principal -->
        <div class="grid grid-cols-1 ">
            <!-- navbar -->
            <div class="shadow-2xl p-2  grid grid-cols-2 items-center">
                <div class="flex h-9 gap-5 items-center">
                    <button id="menuButton" class="text-2xl"><i class="ri-align-justify"></i></button>
                    <input type="text" class="border-2 rounded-2xl p-1 w-full px-5"
                        placeholder="Recherche dans votre boutique...">
                </div>
            </div>
            <!-- la liste -->
            <div class="min-h-[70vh] mx-auto w-full p-6 bg-[#F8F8FF] rounded-lg shadow">
                <!-- Barre d'actions -->
                <div
                    class="flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-200">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Clinico <span
                                class="bg-[#F8F8FF] text-sm text-blue-500 px-2 py-1 rounded-lg">Simple et direct</span>
                        </h2>
                        <p class="text-gray-500">Liste des medecins</p>
                    </div>
                    <div class="flex space-x-3">
                        <div class="flex flex-wrap gap-4">
                            <button class=" text-gray-700 px-4 py-2 rounded-lg text-sm flex items-center hover:bg-red-600" id="supprimer">
                                <i class="ri-delete-bin-6-line mr-2 text-red-500"></i> Supprimer
                            </button>
                            <div class="text-red-400 text-xs" id="msge"></div>
                       </div>
                        <button
                            class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm flex items-center hover:bg-gray-300">
                            <i class="ri-filter-3-line mr-2"></i> Filtres
                        </button>
                        <button id="add_medecin"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center hover:bg-blue-700">
                            <i class="ri-add-line mr-2  "></i> Ajouter medecin
                        </button>
                    </div>
                </div>
                <!-- Tableau -->
                <div class=" border rounded-lg shadow-sm  w-full ">
                    <table class="min-w-full border-collapse">
                        <thead>
                            <tr class="bg-white text-gray-700 uppercase text-sm">
                                <th class="py-3 px-6 text-left w-12">
                                    <input type="checkbox" class="w-5 h-5 accent-blue-500">
                                </th>
                                <th class="py-3 px-6 text-left">Prénom & Nom ⬍</th>
                                <th class="py-3 px-6 text-left">Spécialité ⬍</th>
                                <th class="py-3 px-6 text-left">Email ⬍</th>
                                <th class="py-3 px-6 text-left">Adresse ⬍</th>
                                <th class="py-3 px-6 text-left">Action</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-600 text-sm bg-white" id="liste-medecin">
                            <!-- Ligne de données -->
                        </tbody>
                    </table>
                </div>
            </div>
                    <!-- formulaire -->
            <div id="popup" class="w-[50%] z-50 min-h-[28rem] hidden shadow-md fixed left-66 top-20 p-6 bg-white rounded-lg shadow-md  ml-24  bottom-96">
                <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">Ajouter un Médecin</h2>
                <form id="medecinForm" class=" grid grid-cols-2 gap-4">
                    <div class="mb-4">
                        <label for="">Nom</label>
                        <input type="text" id="nomMedecin"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="NomError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Prénom</label>
                        <input type="text" id="prenomMedecin"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="PrenomError"></div>
                    </div>

                    <div class="mb-4">
                        <label for="">Spécialité</label>
                        <input type="text" id="specialiteMedecin"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="SpecError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Adresse</label>
                        <input type="text" id="adresseMedecin"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="AdressError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Email</label>
                        <input type="text" id="loginMedecin" placeholder="Email"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="EmailError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Password</label>
                        <input type="password" id="passwordMedecin" placeholder="Mot de passe"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="PassError"></div>
                    </div>
                        <button type="submit" id="annuler"
                            class="w-[50%] place-self-end px-4 py-2 text-white bg-gray-300 rounded-lg hover:bg-gray-600 transition">Annuler</button>
                        <button type="submit" id="add"
                            class="w-[50%] px-1 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 transition">Ajouter
                            Médecin</button>
                </form>
            </div>

                                    <!-- formulaire modif -->
            <div id="form-modif" class="w-[50%] z-50 min-h-[28rem] hidden shadow-md fixed left-66 top-20 p-6 bg-white rounded-lg shadow-md  ml-24  bottom-96">
                <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">Ajouter un Médecin</h2>
                <form id="Form-medecin" class=" grid grid-cols-2 gap-4">
                    <input type="hidden" name="" id="id-modif">
                    <div class="mb-4">
                        <label for="">Nom</label>
                        <input type="text" id="nom-modif"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="NomError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Prénom</label>
                        <input type="text" id="prenom-modif"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="PrenomError"></div>
                    </div>

                    <div class="mb-4">
                        <label for="">Spécialité</label>
                        <input type="text" id="specialite-modif"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="SpecError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Adresse</label>
                        <input type="text" id="adresse-modif"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="AdressError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Email</label>
                        <input type="text" id="login-modif" placeholder="Email" readonly
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="EmailError"></div>
                    </div>
                    <div class="mb-4">
                        <label for="">Password</label>
                        <input type="password" id="pass-modif" placeholder="Mot de passe"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <div class="text-red-400 text-xs" id="PassError"></div>
                    </div>
                        <button type="submit" id="annule"
                            class="w-[50%] place-self-end px-4 py-2 text-white bg-gray-300 rounded-lg hover:bg-gray-600 transition">Annuler</button>
                        <button type="submit" id="valider-modif"
                            class="w-[50%] px-1 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-600 transition">Valider
                        </button>
                </form>
            </div>

        </div>

    </div>

    <script src="../../JS/secretaire/crudMedecin.js"></script>
    <script src="../composant/sidebar/sidebar.js"></script>

</body>

</html>
