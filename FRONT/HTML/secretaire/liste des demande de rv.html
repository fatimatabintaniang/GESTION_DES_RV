<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.4.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../composant/sidebar/sidebar.css">
    <title>Gestion Boutique</title>
</head>

<body class="overflow-x-hidden">

    <div class="w-full flex">
        <!-- Barre latérale -->
        <div id="sidebar" class="w-[18%] bg-white p-4 grid grid-cols-1 gap-3 shadow-2xl">
            <div class="flex justify-center">
                <img src="../image/Logo (1).png" class="w-[100%] h-[6vh] img1" alt="Logo">
            </div>

            <!-- Section des éléments de la barre latérale -->
            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <i class="ri-home-4-line text-black text-sm"></i>
                <div class="font-bold text-black sidebar-text text-sm">Home</div>
            </div>

            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <i class="ri-function-add-line text-black text-sm"></i>
                <div class="font-bold text-black sidebar-text text-sm">RV</div>
            </div>

            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <i class="ri-hospital-line text-black text-sm"></i>
                <div class="font-bold text-black sidebar-text text-sm">Médecin</div>
            </div>

            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <i class="ri-line-chart-line text-black text-sm"></i>
                <div class="font-bold text-black sidebar-text text-sm">Analytics</div>
            </div>

            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <i class="ri-calendar-line text-black text-sm"></i>
                <div class="font-bold text-black sidebar-text text-sm">Schedules</div>
            </div>

            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <i class="ri-time-line text-black text-sm"></i>
                <div class="font-bold text-black sidebar-text text-sm">History</div>
            </div>

            <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                <div><i class="ri-money-dollar-box-fill text-black text-sm"></i></div>
                <div class="font-bold text-black sidebar-text text-sm">Sales</div>
            </div>

            <div class="grid grid-cols-1 gap-3 mt-14">
                <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                    <i class="ri-line-chart-line text-black text-sm"></i>
                    <div class="font-bold text-black sidebar-text text-sm">Analytics</div>
                </div>

                <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                    <i class="ri-calendar-line text-black text-sm"></i>
                    <div class="flex justify-between w-full">
                        <div class="font-bold text-black sidebar-text text-sm">Schedules</div>
                        <i class="ri-add-circle-line ms text-sm"></i>
                    </div>
                </div>

                <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                    <i class="ri-time-line text-black text-sm"></i>
                    <div class="font-bold text-black sidebar-text text-sm">History</div>
                </div>

                <div class="sidebar-item flex gap-2 p-2 items-center transition duration-300 ease-in-out hover:bg-blue-100 hover:text-white rounded">
                    <div><i class="ri-money-dollar-box-fill text-black text-sm"></i></div>
                    <div class="flex justify-between w-full">
                        <div class="font-bold text-black sidebar-text text-sm">Sales</div>
                        <i class="ri-arrow-drop-down-line text-sm ms"></i>
                    </div>
                </div>

                <div class="flex gap-3 mt-5 sidebar-item">
                    <img src="./image/istockphoto-1813119566-612x612.jpg" class="w-[40px] h-[40px] img2 rounded-full profil" alt="Profile">
                    <div class="sidebar-text">
                        <span class="text-md">Michael Smith</span>
                        <span class="text-sm">michel12@gmail.com</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contenu principal -->
        <div id="mainContent" class="content-with-sidebar  w-full ">
            <div class="shadow-2xl p-2 rounded-l-2xl grid grid-cols-2 items-center ml-4 fixed ">
                <div class="flex h-9 gap-5 items-center">
                    <button id="menuButton" class="text-2xl"><i class="ri-align-justify"></i></button>
                    <input type="text" id="medecinSearch" class="border-2 rounded-2xl p-1 w-full px-5" placeholder="Rechercher un medcin">
                </div>
            </div>

            <!-- Barre d'actions -->
            <div class="max-w-5xl mx-auto p-6 bg-[#F8F8FF] rounded-lg shadow-lg mt-14 ml-16">
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-200">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Clinico <span class="bg-[#F8F8FF] text-sm text-blue-500 px-2 py-1 rounded-lg">Simple et direct</span></h2>
                        <p class="text-gray-500">Liste des rendez-vous</p>
                    </div>
                    <div class="flex space-x-3">
                        <!-- Bouton de filtre dynamique -->
                        <!-- <button id="filterButton" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm flex items-center hover:bg-gray-300">
                            <i class="ri-filter-3-line mr-2"></i> Filtres
                        </button> -->

                        <!-- Formulaire de filtre pour la date (initialement caché) -->
                        <div id="filterForm" class="hidden mt-3 p-4 bg-white border rounded-lg shadow-lg">
                            <div class="flex flex-col">
                                <label for="dateFilter" class="text-sm text-gray-700">Filtrer par date</label>
                                <input type="date" id="dateFilter" class="border-2 rounded-lg p-2 mt-2" placeholder="Sélectionner une date">
                                <button id="applyFilter" class="bg-blue-500 text-white px-4 py-2 rounded-lg mt-3">Appliquer le filtre</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tableau -->
                <div class="overflow-x-auto border rounded-lg shadow-sm">
                    <table class="min-w-full border-collapse">
                        <thead>
                            <tr class="bg-white text-gray-700 uppercase text-sm">
                                <th class="py-3 px-6 text-left">Date ⬍</th>
                                <th class="py-3 px-6 text-left">Patient ⬍</th>
                                <th class="py-3 px-6 text-left">Médecin ⬍</th>
                                <th class="py-3 px-6 text-left">Motif ⬍</th>
                                <th class="py-3 px-6 text-left">Statut ⬍</th>
                                <th class="py-3 px-6 text-left">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tbody" class="text-gray-600 text-sm bg-white">
                            <!-- Les lignes de données seront insérées ici -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="../../JS/secretaire/RV.js"></script>
    <script src="../../JS/secretaire/recherche.js"></script>
    <script src="script.js"></script> <!-- Le script pour gérer le filtrage -->
    <script src="../composant/sidebar/sidebar.js"></script>

</body>

</html>
