<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinico - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
    
<body class="bg-[#F8F8FF] min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-lg flex overflow-hidden w-full max-w-4xl">
        <!-- Formulaire de connexion -->
        <div class="w-1/2 p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Se connecter</h1>
            <p class="text-gray-600 mb-6">Connectez-vous pour accéder à votre espace personnel.</p>

            <form class="space-y-5" id="loginForm" method="post">
                <div>
                    <span class="text-red-500" id="incorrect"></span>

                    <label class="block text-sm font-medium text-gray-700">Email*</label>
                    <input 
                        id="email"
                        placeholder="Entrez votre email"
                        class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:border-indigo-500 focus:ring-indigo-500"
                    >
                    <span class="text-xs text-red-500 " id="emailError"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Mot de passe*</label>
                    <input 
                        type="password" 
                        id="password"
                        placeholder="••••••••"
                        class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:border-indigo-500 focus:ring-indigo-500"
                    >
                    <span class="text-xs text-red-500 " id="passwordError"></span>
                    <p class="mt-2 text-sm text-gray-500">
                        Sécurisez votre compte et accédez aux fonctionnalités avancées.
                    </p>
                </div>

                <button class="w-full bg-[#0070FF] text-white py-2 rounded-md hover:bg-indigo-700 transition-all font-semibold uppercase">
                    Se connecter
                </button>

                <div class="flex items-center justify-center space-x-2">
                    <div class="flex-1 border-t border-gray-300"></div>
                    <span class="text-sm text-gray-400">OU</span>
                    <div class="flex-1 border-t border-gray-300"></div>
                </div>

                <button class="w-full flex items-center justify-center gap-2 bg-gray-100 border border-gray-300 rounded-md py-2 px-4 hover:bg-gray-200 transition-all">
                    <span class="text-sm font-medium text-gray-700">Se connecter avec Google</span>
                </button>
            </form>
        </div>

        <!-- Image -->
        <div class="w-1/2 bg-cover bg-center" style="background-image: url('../composant/image/Rectangle 9.png');">
            <div class="h-full bg-black bg-opacity-20 flex items-center justify-center text-white text-lg font-medium">
                Bienvenue chez Clinico
        </div>
        </div>
    </div>
    <script src="../../JS/authentification/connexion.js"></script>
</body>
</html>
